<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>IMU 자세 대시보드</title>
<style>
  html, body { margin: 0; height: 100%; background: #10131a; color: #e8ecf3; font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  #canvas-wrap { position: fixed; inset: 0; }
  #hud { position: fixed; top: 16px; left: 16px; padding: 12px 16px; background: rgba(20, 24, 34, 0.75); border: 1px solid #2a3142; border-radius: 10px; font-size: 14px; line-height: 1.6; min-width: 200px; backdrop-filter: blur(4px); }
  #hud h1 { margin: 0 0 8px; font-size: 14px; letter-spacing: .04em; color: #9fb4ff; text-transform: uppercase; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row span:first-child { color: #8791a8; }
  .val { font-variant-numeric: tabular-nums; }
  #status { position: fixed; top: 16px; right: 16px; padding: 6px 12px; border-radius: 999px; font-size: 12px; background: #3a1f1f; color: #ff9d9d; border: 1px solid #5a2b2b; }
  #status.ok { background: #1f3a26; color: #9dffb0; border-color: #2b5a3a; }
  #legend { position: fixed; bottom: 16px; left: 16px; font-size: 12px; color: #8791a8; line-height: 1.6; }
  #legend b { color: #e8ecf3; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="hud">
  <h1>MPU-6050 자세</h1>
  <div class="row"><span>Roll</span><span class="val" id="v-roll">0.0°</span></div>
  <div class="row"><span>Pitch</span><span class="val" id="v-pitch">0.0°</span></div>
  <div class="row"><span>Yaw</span><span class="val" id="v-yaw">0.0°</span></div>
</div>

<div id="status">연결 대기중...</div>

<div id="legend">
  <div><span class="swatch" style="background:#ff5a5a"></span>X (Roll 축) <b>빨강</b></div>
  <div><span class="swatch" style="background:#5aff8f"></span>Y (Pitch 축) <b>초록</b></div>
  <div><span class="swatch" style="background:#5a9dff"></span>Z (Yaw 축) <b>파랑</b></div>
  <div style="margin-top:6px">보드를 기울여서 박스가 같은 방향으로 도는지 확인하세요.<br/>반대로 돌면 아래 <code>AXIS_SIGN</code> 값을 뒤집으면 됩니다.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

// ── 보드 실물과 3D 모형이 반대로 도는 축이 있으면 여기서 -1로 뒤집어서 맞추면 됩니다.
const AXIS_SIGN = { roll: 1, pitch: 1, yaw: 1 };
const WS_URL = "ws://localhost:8765";

// ── Three.js 기본 씬 구성 ─────────────────────────────
const wrap = document.getElementById("canvas-wrap");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.2, 2.4, 3.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
wrap.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(4, 6, 4);
scene.add(dirLight);

scene.add(new THREE.GridHelper(6, 12, 0x2a3142, 0x1c2130));
scene.add(new THREE.AxesHelper(2.2)); // 고정된 월드 축 (참고용)

// ── 보드를 대표하는 박스: 면마다 색을 달라서 "어느 쪽이 위인지" 한눈에 보이게 함
const boardGroup = new THREE.Group();
scene.add(boardGroup);

const materials = [
  new THREE.MeshStandardMaterial({ color: 0xff5a5a }), // +X 오른쪽
  new THREE.MeshStandardMaterial({ color: 0x992e2e }), // -X 왼쪽
  new THREE.MeshStandardMaterial({ color: 0x5aff8f }), // +Y 위
  new THREE.MeshStandardMaterial({ color: 0x2e9954 }), // -Y 아래
  new THREE.MeshStandardMaterial({ color: 0x5a9dff }), // +Z 앞 (USB 커넥터 쪽이라고 가정)
  new THREE.MeshStandardMaterial({ color: 0x2e5a99 }), // -Z 뒤
];
const box = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.35, 1.4), materials);
boardGroup.add(box);

// 어느 쪽이 "정면"인지 표시하는 작은 화살표
const arrow = new THREE.ArrowHelper(
  new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.3, 0.7), 0.8, 0xffffff
);
boardGroup.add(arrow);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── HUD 갱신 ─────────────────────────────
const elRoll = document.getElementById("v-roll");
const elPitch = document.getElementById("v-pitch");
const elYaw = document.getElementById("v-yaw");
const elStatus = document.getElementById("status");

function applyOrientation(roll, pitch, yaw) {
  const d2r = THREE.MathUtils.degToRad;
  // roll  -> Z축 회전, pitch -> X축 회전, yaw -> Y축 회전
  boardGroup.rotation.set(
    d2r(pitch) * AXIS_SIGN.pitch,
    d2r(yaw) * AXIS_SIGN.yaw,
    d2r(roll) * AXIS_SIGN.roll,
    "YXZ"
  );
  elRoll.textContent = `${roll.toFixed(1)}°`;
  elPitch.textContent = `${pitch.toFixed(1)}°`;
  elYaw.textContent = `${yaw.toFixed(1)}°`;
}

// ── 웹소켓 연결 (끊기면 1초마다 재시도) ─────────────────────────────
function connect() {
  const ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    elStatus.textContent = "연결됨";
    elStatus.classList.add("ok");
  };
  ws.onclose = () => {
    elStatus.textContent = "연결 끊김 · 재시도중...";
    elStatus.classList.remove("ok");
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    try {
      const { roll, pitch, yaw } = JSON.parse(event.data);
      applyOrientation(roll, pitch, yaw);
    } catch (e) {
      // 파싱 실패한 프레임은 무시
    }
  };
}
connect();
</script>
</body>
</html>
